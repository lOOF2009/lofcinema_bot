
name: Scene Cinemas Public Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scene-cinemas-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Register subscribers
        run: python bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Check movies
        run: python check.py
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Save data
        if: always()
        run: |
          git config user.name "Scene Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update bot data" || true
          git push
